<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch05 index01.html 파일</h1>

    <script>
      // 1. 함수 선언문 (매개변수)
      function addNumbuer(a, b) {
        const sum = a + b;
        return sum; // return 나를 호출한 사람에 결과를 밖으로 돌려주고 함수를 끝낸다.
      }

      // 2. 함수 호출 (인수)
      const result = addNumbuer(10, 20);
      console.log(result);

      // 3. 생성자 함수랑 어떤 차이가 있는가?
      function Person(firstName, lastName) {
        this.firstName = firstName;
        this.lastName = lastName;
      }

      // 데이터 타입 typeof
      console.log(typeof addNumbuer); // function
      console.log(typeof Person); // function

      // 즉, 함수 선언문, 생성자 함수는 같은 타입으로 취급한다.
      // 단, 다른점은 호출 하는 방법일 뿐이다.

      const sum = addNumbuer(20, 20); // 그냥 호출 --> return 값이 돌아 온다.
      const person1 = new Person("길동", "홍"); // new 를 붙여 호출 --> 새 객체가 생성이 된다.

      console.log(sum);
      console.log(person1);

      // 4. 생성자 함수와 함수 선언문 차이를 말로 설명해보세요
      // 생성자 함수도 함수 선언문에 일종이다. 호출을 할 때 사용하는 방법이 다르다.

      // 5. 실험 1. 함수 선언문에 return 키워드가 없는데 대입연산자를 사용하면 ?

      function sayHello(name) {
        console.log(name + "입니다");
      }

      const returned = sayHello("홍길동");
      console.log(returned); // undefined 가 출력이 된다.

      // 6. 실험 2. return 키워드가 두개라면
      function checkAge(age) {
        if (age < 0) {
          return "잘못된 나이";
          // 리턴 키워드를 만나는 순간 함수가 끝난다 (실행에 제어권 반납)
        } else {
          return age + "세";
        }
        console.log("여기 결과가 찍힐까 말까?");
      }

      console.log(checkAge(-5));
      console.log(checkAge(25));

      // 7. 매개 변수에 기본값을 설정할 수 있다.
      function greet(name = "손님") {
        console.log(name + "님 환영합니다");
      }

      greet();
      greet("이순신");
    </script>
  </body>
</html>
