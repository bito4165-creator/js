<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch09 index02.html</h1>
    <div id="notice">아이디로 접근</div>
    <div class="item">클래스 1</div>
    <div class="item">클래스 2</div>
    <p>태그 이름 1</p>
    <p>태그 이름 2</p>

    <script>
      // 중요 - 요소에 접근하는 5가지 방법

      console.log("---- 1. id 로 찾기 : 요소 하나 ----");
      const notice = document.getElementById("notice");
      console.log(notice);
      console.log(typeof notice);

      console.log("---- 2. class 로 찾기 : 여러 개 (HTMLCollection) ----");
      const itemsByClass = document.getElementsByClassName("item");
      console.log(itemsByClass);
      console.log(typeof itemsByClass);

      console.log("---- 3. 태그 이름으로 찾기 : 여러 개 (HTMLCollection) ----");
      const pElements = document.getElementsByTagName("p");
      console.log(pElements);
      console.log(typeof pElements);

      console.log("---- 4. CSS 선택자로 : 첫 번째 하나 찾기  ----");
      const firstItem = document.querySelector(".item");
      // 현재 웹 문서에서는 .item 클래스 속성을 가진 요소가 2개 이다.
      // 하지만 첫번째 하나만 찾아 준다. !!!
      console.log(firstItem);
      console.log(typeof firstItem);

      // 4.1
      const noticeEl = document.querySelector("#notice");
      console.log(noticeEl);

      console.log("---- 5. CSS 선택자로 : 전부 찾기 (여러개) - NodeList  ----");
      const allItems = document.querySelectorAll(".item");
      console.log(allItems);
      console.log(allItems.length);

      // 6. 실험해보기 : 만약 없는 id를 getElementById로 읽으면 어떻게 될까?
      console.log();
      //document.getElementById("nothing").textContent = "123123";
      // 위 결과를 확인했을 때 방어적 코드를 작성해서 에러가 안나가 수정해보기
      const temp = document.getElementById("nothing");
      if (temp == null || undefined) {
        console.log("요소를 찾을 수 없습니다");
      } else {
        temp.textContent = "123";
      }
    </script>
  </body>
</html>
