<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch08 index01.html 파일</h1>

    <script>
      const products = [
        { id: 1, name: "무선마우스", price: 25000, stock: 3 },
        { id: 2, name: "기계식 키보드", price: 89000, stock: 0 },
        { id: 3, name: "모니터 받침대", price: 15000, stock: 12 },
      ];

      console.log("------- 1. for 문으로 반복 --------");
      for (let i = 0; i < products.length; i++) {
        console.log(products[i].name);
      }

      console.log("------- 2. forEach 로 반복 --------");
      // 1. forEach 는 안에서 콜백을 부를 때 항상 (요소, 인덱스, 배열) 세 개를 순서대로 넘겨 준다.
      // 2. 매개변수를 하나는 적으면 요소만 받고, 두 개를 적으면 인덱스까지 받는다 이름은 자유, 순서는 고정이다.
      products.forEach((product) => {
        console.log(`${product.name}`);
      });

      console.log("------- 3. forEach 두번째 매개변수는 인덱스 이다. --------");
      products.forEach((product, index) => {
        console.log(`${index + 1}  ${product.name}`);
      });

      console.log("------- 4. forEach 는 돌려주는 값이 없다 --------");
      const result = products.forEach((p) => p.name);
      console.log(result); // undefined

      console.log("------- 5. 합계 구하기 --------");
      let totalStock = 0;
      products.forEach((p) => {
        totalStock = totalStock + p.stock;
      });
      console.log(totalStock);

      // 도전 과제 1. products 안에 price의 전체 합계 금액을 구하시오
      let totalPrice = 0;
      products.forEach((p) => {
        totalPrice = totalPrice + p.price;
      });
      console.log(totalPrice);
    </script>
  </body>
</html>
