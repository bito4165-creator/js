<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../reset.css" />
    <style>
      /* 1단계 : 리셋 + 전역 스타일 */
      body {
        font-family: Arial, Helvetica, sans-serif;
        color: #333;
        padding: 20px;
      }

      /* 2단계 : 레이아웃 (큰 틀 배치) */
      .banner-container {
        display: flex;
        align-items: center;
        width: 80%;
        max-width: 600px;
        margin: 50px auto;
      }
      .slider-box {
        flex: 1;
        height: 200px;
        overflow: hidden; /* 버튼 영역 밖으로 나가는 이미지 차단 */
      }
      .image-wrapper {
        display: flex;
        flex: 1;
        width: 100%;
        height: 200px;
        /* 자식 img의 position: absolute 기준점이 된다.
          이게 없으면 img가 body 기준으로 놓여 배너 밖으로 튀어나간다.
        */
        /* 영역 밖으로 나온 부분은 잘라서 보이지 않게 한다. */
        transition: transform 0.5s ease-in-out;
      }

      .image-wrapper img {
        width: 100%;
        height: 100%;
        flex-shrink: 0;
        object-fit: cover;
      }
      /* 3단계 컴포넌트 스타일 */
      .banner-container {
        border: 2px solid black;
        overflow: hidden;
        position: relative;
      }
      .control-btn {
        padding: 20px;
        background: none;
        border: none;
        font-size: 20px;
        z-index: 10;
      }
      /* 4단계 세부 조정 */
      .image-wrapper img {
        opacity: 1;
        visibility: visible;
      }

      .control-btn {
        cursor: pointer;
        transition: transform 0.2s ease;
      }
      .control-btn:hover {
        transform: scale(1.3);
      }
      /* 5단계 반응형 처리 */
    </style>
  </head>
  <body>
    <h1>ch16 index01.html - 배너 변경</h1>

    <div class="banner-container">
      <button class="control-btn prev-btn">&lt;</button>

      <div class="slider-box">
        <div class="image-wrapper">
          <img class="active" src="https://picsum.photos/id/20/400/300" alt="" />
          <img src="https://picsum.photos/id/30/400/300" alt="" />
          <img src="https://picsum.photos/id/40/400/300" alt="" />
        </div>
      </div>

      <button class="control-btn next-btn">&gt;</button>
    </div>
    <script>
      const prevButton = document.querySelector(".prev-btn");
      const nextButton = document.querySelector(".next-btn");
      const imagList = document.querySelectorAll(".image-wrapper img");
      const imageWrapper = document.querySelector(".image-wrapper");

      // 상태 변수: 현재 보이는 이미지의 인덱스, 화면은 항상 이 값을 따라 간다.
      let currentIndex = 0;
      const imageCount = imagList.length; // 이미지 개수 = 3
      const bannerContainer = document.querySelector(".banner-container");
      let timerId = null;

      function startAutoSlide() {
        // 이미 돌고 있으면 또 만들지 않는다. 타이머가 2개면 속도가 2배가 됨.
        if (timerId != null) {
          return;
        }
        timerId = setInterval(() => {
          let newIndex = (currentIndex + 1) % imageCount;
          updateBanner(newIndex);
        }, 3000);
      }
      function stopAutoSlide() {
        clearInterval(timerId);
        timerId = null;
      }

      bannerContainer.addEventListener("mouseenter", () => {
        stopAutoSlide();
      });
      bannerContainer.addEventListener("mouseleave", () => {
        startAutoSlide();
      });

      // 1. 이전 버튼 리스너 등록
      prevButton.addEventListener("click", () => {
        let newIndex = (currentIndex - 1 + imageCount) % imageCount;
        updateBanner(newIndex);
      });
      // 2. 다음 버튼 리스너 등록
      nextButton.addEventListener("click", () => {
        let newIndex = (currentIndex + 1) % imageCount;
        updateBanner(newIndex);
      });

      // 확인 : currrentIndex 가 0,1,2 일 때
      // 이전 : (0 - 1 + 3) % 3 = 2
      // 이전 : (1 - 1 + 3) % 3 = 0
      // 이전 : (2 - 1 + 3) % 3 = 1
      // 다음 : (0 + 1) % 3 = 1
      // 다음 : (1 + 1) % 3 = 2
      // 다음 : (2 + 1) % 3 = 0

      // 화면에 갱신은 이 함수가 무조건 처리하고 버튼의 인데스만 전달한다.
      function updateBanner(newIndex) {
        currentIndex = newIndex;
        // 슬라이더 전체 트랙을 왼쪽으로 이동 (100%, 200%, 300% ...)
        imageWrapper.style.transform = `translateX(-${currentIndex * 100}%)`;
      }
      startAutoSlide();
    </script>
  </body>
</html>
