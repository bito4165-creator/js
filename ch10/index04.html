<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch10 index02.html</h1>

    <button id="back-btn">뒤로 가기</button>
    <button id="forward-btn">앞으로 가기</button>
    <button id="go-btn">두 단계 뒤로</button>

    <script>
      /// 단, get 요청방식에 웹페이지 이동만 계산 됨.
      console.log(window.history.length); // 현재 탭에서 방문한 개수

      document.getElementById("back-btn").addEventListener("click", function () {
        window.history.back();
      });
      // 뒤로 갔다 온 기록이 있어야 앞으로 가기가 동작 한다.
      document.getElementById("forward-btn").addEventListener("click", function () {
        window.history.forward();
      });

      document.getElementById("go-btn").addEventListener("click", function () {
        window.history.go(-2);
      });
    </script>
  </body>
</html>
