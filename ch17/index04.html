<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch17 index04.html 파일</h1>
    <input type="text" value="소주" style="padding: 4px" id="orderInput" />
    <button id="orderButton">주문 시작</button>
    <p id="noticeBoard" style="padding: 50px; border: 1px solid #ccc; text-align: center">주문을 기다리고 있습니다.</p>

    <script>
      const orderButton = document.getElementById("orderButton");
      const orderInput = document.getElementById("orderInput");
      const noticeBoard = document.getElementById("noticeBoard");

      // 함수 선언문 - 주문을 받아서 Promise를 돌려준다.
      function orderCoffee(order) {
        // 코드 작성 ...
        return new Promise(function (resolve, rejected) {
          // 이 안에는 시간이 걸리는 작업을 적는다. 여기서는 3초 타이머로 흉내만 냄
          setTimeout(function () {
            // 3초 뒤 응답이 오면 해야할 일을 설계한다.
            if (order === "아메리카노" || order === "라떼") {
              resolve(order + "가 나왔씁니다."); // 성공 : 이행 상태로 바꾸고 값을 전달
            } else {
              rejected("죄송합니다. " + order + "은 판매하지 않습니다."); // 실패 : 거부 상태로 바꾸고 이유 전달
            }
          }, 3000);
        });
      }

      // await를 사용할려면 그 코드를 감싸는 함수에는 반드시 async를 붙여야한다.
      // orderButton.addEventListener("click", async function () {
      //   await orderCoffee(orderInput.value);
      // });
      orderButton.addEventListener("click", async () => {
        try {
          console.log("111111111111");
          const message = await orderCoffee(orderInput.value);
          noticeBoard.textContent = message;
          console.log("222222222222222");
        } catch (error) {
          noticeBoard.textContent = error;
          console.log("33333333333333333333");
        }
      });
    </script>
  </body>
</html>
