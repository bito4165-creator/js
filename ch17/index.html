<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>index.html</h1>
    <script>
      function fetchData() {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            const success = true;
            if (success) {
              resolve({ id: 1, name: "Alice" });
            } else {
              reject(new Error("데이터 요청 실패"));
            }
          }, 1000);
        });
      }
      async function handleDate() {
        try {
            const data = await fetchData();
            console.log("1. 데이터 수신");
            
            const userName = data.name;
            console.log("2. 사용자 이름 : ${userName}");
        } catch (error) {
            console.error("에러 발생:", error.message);
        } finally {
            console.log("3. 작업 완료")
        }
      }
      handleDate();


      const button = document.querySelector("#fetchBtn");
      
      button.addEventListener("click", ()=> {
        console.log("요청시작..");

        fetchData()
        .then((data) => {
            console.log("성공", data);
            document.querySelector("#result").textContent = data.name;
        })
        .catch((error) => {
            console.error("실패", error.message);
        });
      });

      const button2 = document.querySelector("#fetchBtn2");

      button2.addEventListener("click", async ()=> {
        console.log("1. 요청 시작");

        try {
            const data = await fetchData();
            console.log("성공", data);
            document.querySelector("#result").textContent = data.name;
        } catch (error) {
            console.error("실패", error.message);
        }
      });
    </script>
  </body>
</html>
