<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch04 index03.html 파일</h1>

    <script>
      console.log("1. 배열 만들기와 인덱스 ");
      const furits = ["사과", "바나나", "포도"];

      console.log(furits);
      console.log(furits[0]);
      console.log(furits[2]);
      console.log(furits[3]); // n - 1 // 없는 인덱스 번호 - undefined
      console.log(furits.length);

      // 항상 마지막 인덱스 값을 출력할 때 많이 사용 됨.
      console.log(furits[furits.length - 1]);

      // JS 배열에 값 추가와 제거
      furits.push("딸기"); // 요소의 맨 뒤에 추가
      console.log(furits);

      furits.pop(); // 요소의 맨 뒤에서 하나 제거
      console.log(furits);

      furits[1] = "블루베리";
      console.log(furits);

      // 반복문 활용하기

      // 방법 1 인덱스를 활용할 때 사용하는 for 구문
      for (let i = 0; i < furits.length; i++) {
        console.log(i + "번째 과일 " + furits[i]);
      }

      // 방법 2 for...of 값만 필요할 때 사용한다.
      for (const f of furits) {
        console.log(f);
      }

      // 객체와 배열 : 서버 데이의 터의 기본 형태
      const studentList = [
        { name: "홍길동", age: 20, major: "컴퓨터공학" },
        { name: "이순신", age: 21, major: "경영" },
      ];

      // 반복문 돌면서 해당 객체의 이름과 나이를 출력 하시오 (전체)
      for (const s of studentList) {
        // 만약 나이가 21 이상만 출력
        if (s.age >= 21) {
          console.log(s.name);
          console.log(s.age);
        }
      }
    </script>
  </body>
</html>
